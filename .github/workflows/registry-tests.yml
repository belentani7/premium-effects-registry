name: Offline registry tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check src/registry.cjs
          node --check bin/effects.cjs
          node --check tests/registry.test.cjs
      - name: Unit and CLI integration
        run: node --test tests/*.test.cjs
      - name: Offline smoke
        run: node bin/effects.cjs --kind webgl --json
